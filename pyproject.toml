[project]
name = "home-doc-organizer"
version = "0.1.0"
description = "家庭書類自動整理システム（プロトタイプ・第1〜4段階）"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
ocr = [
    "pillow>=10.0",
    "pillow-heif>=0.15",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[project.scripts]
home-doc-organizer = "home_doc_organizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
